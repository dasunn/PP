name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Skip PRs from forks: they cannot read repository secrets.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          IS_PROD: ${{ github.event_name != 'pull_request' }}
          PR_NUMBER: ${{ github.event.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$IS_PROD" = "true" ]; then
            npx --yes netlify-cli@27 deploy \
              --prod \
              --dir=dist \
              --message="main@${SHA}" \
              --json > deploy.json
          else
            npx --yes netlify-cli@27 deploy \
              --dir=dist \
              --alias="pr-${PR_NUMBER}" \
              --message="PR #${PR_NUMBER} @ ${SHA}" \
              --json > deploy.json
          fi

          URL=$(jq -r '.deploy_url // .url' deploy.json)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
          echo "### Netlify deploy: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Deploy preview ready: ${process.env.DEPLOY_URL}`,
            });
